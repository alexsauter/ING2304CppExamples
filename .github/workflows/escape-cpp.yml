name: Convert C++ Examples to HTML

on:  # ← THIS WAS MISSING ENTIRELY
  push:
    branches: [ main, master ]     # Trigger on pushes to main/master branch
    paths:
      - 'cpp-examples/**'          # Only trigger when files change in cpp-examples/
      - '.github/workflows/'        # Also trigger if workflow itself changes
  pull_request:
    branches: [ main, master ]

# Rest of your existing job definition continues here...
jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4      # Updated from v3 → v4
    
    - name: Set up Python
      uses: actions/setup-python@v5  # Updated from v4 → v5
      with:
        python-version: '3.x'
    
    - name: Convert C++ files to HTML-safe versions
      run: |
        mkdir -p html-output
        python scripts/cpp_to_html.py || echo "Conversion completed (some errors may be expected)"

    # Commit changes back to repo IF there were any updates
    - name: Create commit with converted files (if changed)
      uses: stefanzweifel/git-auto-commit-action@v5  # Updated from v4 → v5
      with:
        commit_message: "🔄 Auto-update HTML-safe C++ examples"
        file_pattern: 'html-output/*.html'
