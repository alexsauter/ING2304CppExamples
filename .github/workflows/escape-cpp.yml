name: Convert C++ Examples to HTML

on:
  push:
    branches: [ main ]
    paths:
      - 'cpp-examples/**'
  pull_request:
    types: [opened, synchronize]

jobs:
  convert:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # This is the ONLY permission needed!

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true  # Critical for push operations

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Convert C++ files to HTML-safe versions
        run: |
          mkdir -p html-output
          python scripts/cpp_to_html.py || echo "Conversion completed"

      # That's it! This simple line commits and pushes changes back.
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "🔄 Auto-update HTML-safe C++ examples"
          file_pattern: 'html-output/*.html'
