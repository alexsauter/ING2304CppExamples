name: Test Secret Access
on: [workflow_dispatch]  # Manual trigger only for testing

jobs:
  check-token:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token exists (without revealing value)
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "❌ ERROR: PAT_TOKEN secret not found!"
            exit 1
          else
            TOKEN_LENGTH=${#{ secrets.PAT_TOKEN }}
            echo "✅ SUCCESS: PAT_TOKEN exists with length $TOKEN_LENGTH"
            
            # Verify it starts with 'ghp_' (standard GitHub PAT prefix)
            if [[ "${{ secrets.PAT_TOKEN }}" == ghp_* ]]; then
              echo "🔒 Token format looks correct (starts with ghp_)"
            else
              echo "⚠️ Warning: Unexpected token format"
            fi
          fi
