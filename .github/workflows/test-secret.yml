name: Verify Token Setup
on: [workflow_dispatch]  # Manual trigger for testing only

jobs:
  check-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PAT_TOKEN exists and has correct format
        run: |
          TOKEN="${{ secrets.PAT_TOKEN }}"
          
          if [ -z "$TOKEN" ]; then
            echo "❌ ERROR: PAT_TOKEN secret not found!"
            exit 1
          else
            # Get token length using expr command (more portable)
            TOKEN_LENGTH=$(echo -n "$TOKEN" | wc -c)
            echo "✅ SUCCESS: PAT_TOKEN exists with length $TOKEN_LENGTH characters"
            
            # Verify it starts with 'ghp_' (standard GitHub PAT prefix)
            if [[ "$TOKEN" == ghp_* ]]; then
              echo "🔒 Token format looks correct (starts with ghp_)"
            else
              echo "⚠️ Warning: Unexpected token format - may still work but unusual"
            fi
            
            # Additional validation checks
            if [ ${#TOKEN} -lt 30 ]; then
              echo "❌ ERROR: Token seems too short (< 30 chars)"
              exit 1
            else
              echo "✅ Token length appears valid"
            fi
          fi

      - name: Validate WORKFLOW_TOKEN exists (optional)
        run: |
          WTOKEN="${{ secrets.WORKFLOW_TOKEN }}"
          
          if [ -z "$WTOKEN" ]; then
            echo "ℹ️ INFO: WORKFLOW_TOKEN not set (this is optional)"
          else
            echo "✅ SUCCESS: WORKFLOW_TOKEN also exists"
          fi
